
{% extends "dashboard/base.html" %}

{% block content %}
<h1 class="mb-4">Delete Sale</h1>

<div class="card">
    <div class="card-body">
        <p>
            Are you sure you want to delete the sale for
            <strong>{{ sale.menu_item.name }}</strong>
            on {{ sale.sale_date }}?
        </p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>
            <a href="{% url 'sale_list' %}"
               class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
