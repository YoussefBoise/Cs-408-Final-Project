
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Food Trailer Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- Shared navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">
                Food Trailer Management
            </a>

            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'home' %}">Dashboard</a>
                <a class="nav-link" href="{% url 'menu_list' %}">Menu</a>
                <a class="nav-link" href="{% url 'inventory_list' %}">Inventory</a>
                <a class="nav-link" href="{% url 'event_list' %}">Events</a>
                <span class="nav-link text-secondary">Sales</span>
                <span class="nav-link text-secondary">Expenses</span>
                <span class="nav-link text-secondary">Search</span>
            </div>
        </div>
    </nav>

    <!-- Page content -->
    <main class="container my-5 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Shared footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">Food Trailer Management System</p>
    </footer>

</body>
</html>
